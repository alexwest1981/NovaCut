name: ci

# Unit tests and a syntax pass over every script. Deliberately no `npm install`:
# the tests are pure Node (node:test, no dependencies) and the only dependency
# is Electron itself, which they do not need — so CI stays fast and does not
# pull a 100 MB runtime to run seven assertions.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check every script
        run: |
          for f in $(git ls-files '*.js'); do
            node --check "$f" || exit 1
          done

      - name: Unit tests
        run: npm test

      # The two gates that are not node tests: the palettes against WCAG AA, and
      # the bundled fonts against the curated list (also asserted in npm test).
      - name: Accessibility and asset gates
        run: |
          python3 tools/contrast-check.py
          python3 tools/bundle-fonts.py --check
